# cargo-make tasks — modeled on iroh-ffi (swift-xcframework, bindgen-kotlin). Phase 0 build plan §2 B6.
# Host tasks were run in the Phase 0 build container. Device tasks are declared; they run on the operator's machine
# (Xcode / NDK are not present in the container). Run: `cargo make <task>` from the repo root.
[config]
default_to_workspace = false

[env]
CORE_DIR = "core"
LIB = "lfs_core"

[tasks.test]
description = "Host: unit tests (B1/B2/B3). B4 live resolve is #[ignore] — see test-network."
command = "cargo"
args = ["test", "--manifest-path", "${CORE_DIR}/Cargo.toml", "-p", "${LIB}"]

[tasks.test-network]
description = "Host: B4 live DID→PDS resolve (needs egress to plc.directory)."
command = "cargo"
args = ["test", "--manifest-path", "${CORE_DIR}/Cargo.toml", "-p", "${LIB}", "--", "--ignored", "resolve_known_did_to_pds"]

[tasks.build-subduction]
description = "Host: B5 — confirm the Subduction git workspace compiles into the core (feature-gated)."
command = "cargo"
args = ["build", "--manifest-path", "${CORE_DIR}/Cargo.toml", "-p", "${LIB}", "--features", "subduction"]

[tasks.bindgen-kotlin]
description = "Android: generate Kotlin bindings from the cdylib (uniffi 0.32 proc-macro mode; library mode)."
script = '''
cargo build --manifest-path ${CORE_DIR}/Cargo.toml -p ${LIB} --release
cargo run --manifest-path ${CORE_DIR}/Cargo.toml -p uniffi-bindgen -- generate \
  --library ${CORE_DIR}/target/release/lib${LIB}.so --language kotlin --out-dir bindings/kotlin/generated
'''

[tasks.android-so]
description = "Android: cross-compile cdylib for arm64 + x86_64 (requires cargo-ndk + NDK)."
script = '''
cargo ndk -t arm64-v8a -t x86_64 -o bindings/kotlin/jniLibs build --manifest-path ${CORE_DIR}/Cargo.toml -p ${LIB} --release
'''

[tasks.swift-xcframework]
description = "iOS: staticlib for device + simulator, Swift bindings, xcframework (requires Xcode; run on macOS)."
script = '''
cargo build --manifest-path ${CORE_DIR}/Cargo.toml -p ${LIB} --release --target aarch64-apple-ios
cargo build --manifest-path ${CORE_DIR}/Cargo.toml -p ${LIB} --release --target aarch64-apple-ios-sim
cargo run --manifest-path ${CORE_DIR}/Cargo.toml -p uniffi-bindgen -- generate \
  --library ${CORE_DIR}/target/aarch64-apple-ios/release/lib${LIB}.a --language swift --out-dir bindings/swift/generated
# xcodebuild -create-xcframework … (fill in from automerge-swift precedent on first iOS run; log as binding-build)
'''
