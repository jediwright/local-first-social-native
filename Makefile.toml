# cargo-make tasks — modeled on iroh-ffi (swift-xcframework, bindgen-kotlin). Phase 0 build plan §2 B6.
# Host tasks were run in the Phase 0 build container. Device tasks are declared; they run on the operator's machine
# (Xcode / NDK are not present in the container). Run: `cargo make <task>` from the repo root.
# Run 13 (2026-09-20): device tasks cd into ${CORE_DIR} — cargo-ndk and uniffi-bindgen run `cargo metadata`
# in the cwd before honouring --manifest-path; bindgen-kotlin reads the Android arm64 .so (host cdylib is
# .dylib on macOS, .so on Linux).
[config]
default_to_workspace = false

[env]
CORE_DIR = "core"
LIB = "lfs_core"

[tasks.test]
description = "Host: unit tests (B1/B2/B3). B4 live resolve is #[ignore] — see test-network."
command = "cargo"
args = ["test", "--manifest-path", "${CORE_DIR}/Cargo.toml", "-p", "${LIB}"]

[tasks.test-network]
description = "Host: B4 live DID→PDS resolve (needs egress to plc.directory)."
command = "cargo"
args = ["test", "--manifest-path", "${CORE_DIR}/Cargo.toml", "-p", "${LIB}", "--", "--ignored", "resolve_known_did_to_pds"]

[tasks.build-subduction]
description = "Host: B5 — confirm the Subduction git workspace compiles into the core (feature-gated)."
command = "cargo"
args = ["build", "--manifest-path", "${CORE_DIR}/Cargo.toml", "-p", "${LIB}", "--features", "subduction"]

[tasks.android-so]
description = "Android: cross-compile cdylib for arm64 + x86_64 (requires cargo-ndk + NDK)."
script = '''
set -e
cd "${CORE_DIR}"
cargo ndk -t arm64-v8a -t x86_64 -o ../bindings/kotlin/jniLibs build -p "${LIB}" --release
'''

[tasks.bindgen-kotlin]
description = "Android: generate Kotlin bindings from the arm64 Android cdylib (uniffi 0.32 proc-macro mode; library mode)."
dependencies = ["android-so"]
script = '''
set -e
cd "${CORE_DIR}"
cargo run -p uniffi-bindgen -- generate \
  --library ../bindings/kotlin/jniLibs/arm64-v8a/lib${LIB}.so --language kotlin --out-dir ../bindings/kotlin/generated
'''

[tasks.swift-xcframework]
description = "iOS: staticlib for device + simulator, Swift bindings, xcframework (requires Xcode; run on macOS)."
script = '''
set -e
cd "${CORE_DIR}"
cargo build -p "${LIB}" --release --target aarch64-apple-ios
cargo build -p "${LIB}" --release --target aarch64-apple-ios-sim
cargo run -p uniffi-bindgen -- generate \
  --library target/aarch64-apple-ios/release/lib${LIB}.a --language swift --out-dir ../bindings/swift/generated
rm -rf ../bindings/swift/include ../bindings/swift/lfs_coreFFI.xcframework
mkdir -p ../bindings/swift/include
cp ../bindings/swift/generated/lfs_coreFFI.h ../bindings/swift/include/lfs_coreFFI.h
cp ../bindings/swift/generated/lfs_coreFFI.modulemap ../bindings/swift/include/module.modulemap
xcodebuild -create-xcframework \
  -library target/aarch64-apple-ios/release/lib${LIB}.a -headers ../bindings/swift/include \
  -library target/aarch64-apple-ios-sim/release/lib${LIB}.a -headers ../bindings/swift/include \
  -output ../bindings/swift/lfs_coreFFI.xcframework
'''
